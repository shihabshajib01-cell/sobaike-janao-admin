<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>if(window.top!==window.self){document.documentElement.style.display='none';}</script>
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <title>Sobaike Admin Panel</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%230284c7' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpath d='M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z' fill='%230284c7'/%3E%3C/svg%3E" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Bengali:wght@400;500;600;700&family=Noto+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <meta name="description" content="Enterprise operational control system and administration foundation for the Sobaike platform." />
    <meta property="og:title" content="Sobaike Admin Panel" />
    <meta property="og:description" content="Enterprise operational control system and administration foundation for the Sobaike platform." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
  </head>
  <body class="min-h-screen bg-slate-50 dark:bg-slate-950 text-slate-900 dark:text-slate-100 antialiased">
    <div id="root">
      <main
        id="admin-boot-fallback"
        role="status"
        aria-live="polite"
        style="min-height:100vh;display:grid;place-items:center;padding:24px;font-family:system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#f8fafc;color:#0f172a"
      >
        <section style="width:min(440px,100%);text-align:center">
          <div
            aria-hidden="true"
            style="width:32px;height:32px;margin:0 auto 16px;border:3px solid #cbd5e1;border-top-color:#0284c7;border-radius:9999px;animation:sobaike-boot-spin .8s linear infinite"
          ></div>
          <p style="margin:0;color:#64748b;font-size:14px;line-height:1.6">Loading admin panel…</p>
        </section>
      </main>
      <style>@keyframes sobaike-boot-spin{to{transform:rotate(360deg)}}</style>
    </div>
    <script type="module" src="./src/entry.js"></script>
    <script>
      window.setTimeout(function () {
        var fallback = document.getElementById('admin-boot-fallback');
        if (!fallback) return;

        var storageKey = 'sobaike-admin-boot-retries';
        var retries = Number(window.sessionStorage.getItem(storageKey) || '0');

        if (retries < 2) {
          window.sessionStorage.setItem(storageKey, String(retries + 1));
          var nextUrl = new URL(window.location.href);
          nextUrl.searchParams.set('__boot_refresh', Date.now().toString());
          window.location.replace(nextUrl.toString());
          return;
        }

        window.sessionStorage.removeItem(storageKey);
        fallback.replaceChildren();

        var section = document.createElement('section');
        section.style.cssText = 'width:min(440px,100%);text-align:center';

        var heading = document.createElement('h1');
        heading.style.cssText = 'margin:0 0 8px;font-size:20px;line-height:1.4';
        heading.textContent = 'Admin panel did not finish loading';

        var message = document.createElement('p');
        message.style.cssText = 'margin:0 0 16px;color:#64748b;font-size:14px;line-height:1.6';
        message.textContent = 'A cached deployment may still be open in this tab.';

        var reloadButton = document.createElement('button');
        reloadButton.type = 'button';
        reloadButton.style.cssText = 'min-height:40px;padding:0 16px;border:0;border-radius:6px;background:#0284c7;color:#fff;font:600 14px system-ui;cursor:pointer';
        reloadButton.textContent = 'Reload';
        reloadButton.addEventListener('click', function () {
          window.location.reload();
        });

        section.append(heading, message, reloadButton);
        fallback.appendChild(section);
      }, 4000);

      window.addEventListener('load', function () {
        if (!document.getElementById('admin-boot-fallback')) {
          window.sessionStorage.removeItem('sobaike-admin-boot-retries');
        }
      });
    </script>
  </body>
</html>
