name: Admin Mock Dead Code Audit

on:
  push:
    branches:
      - cleanup/mock-dead-code

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout cleanup branch
        uses: actions/checkout@v4
        with:
          ref: cleanup/mock-dead-code

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck and production build
        run: |
          npm run lint
          npm run build

      - name: Enforce no mock dummy fixture runtime paths
        shell: bash
        run: |
          set -euo pipefail
          test ! -e src/services/mock/complaintService.ts
          test ! -e src/services/mock/complaintDetailService.ts
          test ! -e src/services/mock/statusTransitionService.ts
          test ! -e src/services/mock/timelineService.ts
          test ! -e src/services/mock/workflowService.ts
          test ! -e src/services/fallback/complaintFallback.ts

          if git grep -n -E 'services/mock|services/fallback|complaintFallback|mockComplaint|mockWorkflow|FALLBACK_NOTIFICATIONS|inMemoryFallbackNotifications|DEV_MOCK|DEV_FALLBACK|dev_fallback|inMemoryUsers|FALLBACK_AUDIT_LOGS|FALLBACK_ROLES|inMemoryRoles|inMemoryRolePermissions' -- 'src/**'; then
            echo 'Forbidden mock/dummy/fallback runtime reference remains.' >&2
            exit 1
          fi

          if git grep -n -E 'TODO|FIXME|stub|not implemented|Not implemented' -- 'src/**/*.ts' 'src/**/*.tsx'; then
            echo 'Unfinished source marker remains.' >&2
            exit 1
          fi

      - name: Runtime dependency audit
        run: npm audit --omit=dev

      - name: Static unused inventory
        shell: bash
        run: |
          set +e
          npx --yes knip --reporter compact
          exit 0
