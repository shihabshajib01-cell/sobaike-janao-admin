name: Admin Mock Dead Code Audit

on:
  push:
    branches:
      - cleanup/mock-dead-code
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout cleanup branch
        uses: actions/checkout@v4
        with:
          ref: cleanup/mock-dead-code

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Baseline typecheck and build
        run: |
          npm run lint
          npm run build

      - name: Inventory remaining mock fallback and unfinished code
        shell: bash
        run: |
          set -euo pipefail
          echo '===== MOCK/FALLBACK DIRECTORIES ====='
          find src/services/mock src/services/fallback -type f -maxdepth 3 -print 2>/dev/null || true
          echo '===== MOCK / DUMMY / FIXTURE / DEV FALLBACK REFERENCES ====='
          git grep -n -E 'services/mock|services/fallback|complaintFallback|mockComplaint|mockWorkflow|MOCK_|DEV_MOCK|DEV_FALLBACK|FALLBACK_|dev_fallback|fixture|fixtures|dummy|import\.meta\.env\.DEV|\bisDev\b' -- 'src/**' || true
          echo '===== TODO / FIXME / STUB / UNIMPLEMENTED ====='
          git grep -n -E 'TODO|FIXME|stub|not implemented|Not implemented|coming soon|Coming soon' -- 'src/**/*.ts' 'src/**/*.tsx' || true

      - name: Static unused file and dependency audit
        shell: bash
        run: |
          set +e
          npx --yes knip --reporter compact
          exit 0
