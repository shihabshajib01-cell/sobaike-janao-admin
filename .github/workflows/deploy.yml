name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read
  actions: write
  pages: write
  id-token: write

concurrency:
  group: "admin-vite-pages"
  cancel-in-progress: true

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Cancel legacy Jekyll Pages publisher
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          for attempt in {1..10}; do
            curl -fsSL \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "X-GitHub-Api-Version: 2026-03-10" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runs?head_sha=${GITHUB_SHA}&per_page=100" \
              -o /tmp/pages-runs.json

            read -r status run_id < <(python - <<'PY'
          import json
          from pathlib import Path

          payload = json.loads(Path('/tmp/pages-runs.json').read_text())
          matches = [
              run for run in payload.get('workflow_runs', [])
              if run.get('name') == 'pages build and deployment'
          ]
          if not matches:
              print('none none')
          else:
              run = max(matches, key=lambda item: item.get('id', 0))
              print(run.get('status') or 'unknown', run.get('id') or 'none')
          PY
            )

            if [ "$run_id" != "none" ]; then
              if [ "$status" = "completed" ]; then
                echo "Legacy Pages run $run_id already completed; custom Vite deployment will replace it."
              else
                echo "Cancelling legacy Jekyll Pages run $run_id (status: $status)."
                curl -fsSL -X POST \
                  -H "Accept: application/vnd.github+json" \
                  -H "Authorization: Bearer $GH_TOKEN" \
                  -H "X-GitHub-Api-Version: 2026-03-10" \
                  "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runs/$run_id/cancel"
              fi
              break
            fi

            if [ "$attempt" -eq 10 ]; then
              echo "No legacy Pages run detected; continuing with the custom Vite publisher."
              break
            fi
            sleep 2
          done

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Notification center audit
        run: npm run audit:notifications

      - name: Responsive table audit
        run: npm run audit:responsive-tables

      - name: Button system audit
        run: npm run audit:buttons

      - name: Table page-size audit
        run: npm run audit:table-page-size

      - name: Tag and feedback audit
        run: npm run audit:tags-feedback

      - name: Sourced report duplicate audit
        run: npm run audit:duplicate-reports

      - name: News Intake audit
        run: npm run audit:news-intake

      - name: News Intake behavior audit
        run: npm run audit:news-intake-behavior

      - name: News Intake publisher fixture audit
        run: npm run audit:news-intake-publisher-fixtures

      - name: News Intake preview parity audit
        run: npm run audit:news-intake-preview-parity

      - name: Bundle-check News Intake Edge Function
        run: npx --no-install esbuild supabase/functions/news-intake-scan/index.ts --bundle --platform=neutral --format=esm --external:jsr:* --external:npm:* --outfile=/tmp/news-intake-scan.mjs

      - name: Browser smoke syntax check
        run: node --check scripts/admin-functional-smoke.mjs

      - name: Dependency security audit
        run: npm run audit:dependencies

      - name: Admin hardening audit
        run: npm run audit:hardening

      - name: Global UX audit
        run: npm run audit:global-ux

      - name: Dead-code audit
        run: npm run audit:dead-code

      - name: Type check
        run: npm run lint

      - name: Build production bundle
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
        run: npm run build

      - name: Verify dist output
        run: |
          ls -la dist
          test -f dist/geo/bangladesh-districts-2020.geojson
          test -f dist/geo/upazilas/manifest.json
          for division in barisal chittagong dhaka khulna mymensingh rajshahi rangpur sylhet; do
            test -f "dist/geo/upazilas/${division}-2020.geojson"
          done
          node - <<'NODE'
          const fs = require('fs');
          const manifest = JSON.parse(fs.readFileSync('dist/geo/upazilas/manifest.json', 'utf8'));
          if (manifest.canonical_registry_count !== 601 ||
              manifest.division_count !== 8 ||
              manifest.district_count !== 64 ||
              manifest.published_verified_polygon_count !== 544 ||
              manifest.registry_without_verified_polygon_count !== 57) {
            throw new Error('Admin deployed map geography contract is incomplete');
          }
          NODE
          cat dist/index.html
          if grep -Eq 'src/(main\.tsx|entry\.js)' dist/index.html; then
            echo "ERROR: dist/index.html still references source entry files. Aborting deployment."
            exit 1
          fi
          expected_asset=$(grep -o 'assets/index-[^" ]*\.js' dist/index.html | head -1)
          test -n "$expected_asset"
          echo "VERIFICATION PASSED: dist/index.html references bundled assets only."

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'
          name: github-pages-${{ github.run_attempt }}

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_attempt }}

      - name: Verify deployed Admin bundle
        shell: bash
        env:
          SITE_URL: https://shihabshajib01-cell.github.io/sobaike-janao-admin/
        run: |
          set -euo pipefail
          expected_asset=$(grep -o 'assets/index-[^" ]*\.js' dist/index.html | head -1)
          test -n "$expected_asset"

          for attempt in {1..18}; do
            code=$(curl -L -sS -o /tmp/admin-index.html -w "%{http_code}" "$SITE_URL" || true)
            if [ "$code" = "200" ] \
              && ! grep -Eq 'src/(main\.tsx|entry\.js)' /tmp/admin-index.html \
              && grep -q "$expected_asset" /tmp/admin-index.html; then
              asset_code=$(curl -L -sS -o /tmp/admin-asset.js -w "%{http_code}" "$SITE_URL$expected_asset" || true)
              if [ "$asset_code" = "200" ]; then
                echo "Production bundle verification passed."
                exit 0
              fi
            fi

            echo "Attempt $attempt did not yet serve the expected bundle; retrying..."
            sleep 5
          done

          echo "ERROR: GitHub Pages did not serve the expected production bundle."
          cat /tmp/admin-index.html || true
          exit 1
