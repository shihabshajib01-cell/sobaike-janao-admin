name: Production Smoke

on:
  workflow_run:
    workflows: ["Deploy to GitHub Pages"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SITE_URL: https://shihabshajib01-cell.github.io/sobaike-janao-admin/
      SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
      SUPABASE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}

    steps:
      - name: Verify live Admin site
        shell: bash
        run: |
          set -euo pipefail
          ok=0
          for attempt in {1..12}; do
            code=$(curl -L -sS -o /tmp/admin-index.html -w "%{http_code}" "$SITE_URL" || true)
            if [ "$code" = "200" ]; then
              if python - <<'PY'
          from pathlib import Path
          html = Path('/tmp/admin-index.html').read_text(errors='replace')
          valid_root = 'id="root"' in html or "id='root'" in html
          source_free = '/src/main.tsx' not in html and '/src/entry.js' not in html and 'src/main.tsx' not in html and 'src/entry.js' not in html
          has_bundle = 'assets/' in html and '.js' in html
          raise SystemExit(0 if valid_root and source_free and has_bundle else 1)
          PY
              then
                ok=1
                break
              fi
              echo "Attempt $attempt reached the site but the new production bundle is not visible yet; retrying..."
            else
              echo "Attempt $attempt returned HTTP $code; retrying..."
            fi
            sleep 10
          done
          test "$ok" = "1"

          asset_path=$(grep -o 'assets/index-[^" ]*\.js' /tmp/admin-index.html | head -1)
          test -n "$asset_path"
          asset_code=$(curl -L -sS -o /tmp/admin-main.js -w "%{http_code}" "$SITE_URL$asset_path" || true)
          test "$asset_code" = "200"

          if grep -Eq 'src/(main\.tsx|entry\.js)' /tmp/admin-index.html; then
            echo "ERROR: live Admin index references source entry files"
            exit 1
          fi

          echo "Admin site smoke check passed with live bundle asset"

      - name: Verify private Admin RPC rejects anonymous access
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SUPABASE_URL"
          test -n "$SUPABASE_KEY"

          http_code=$(curl -sS \
            -o /tmp/admin-private-rpc.json \
            -w "%{http_code}" \
            -X POST "$SUPABASE_URL/rest/v1/rpc/admin_get_response_detail" \
            -H "apikey: $SUPABASE_KEY" \
            -H "Authorization: Bearer $SUPABASE_KEY" \
            -H "Content-Type: application/json" \
            -d '{"p_response_id":"__production_smoke_unauthorized__"}')

          if [ "$http_code" -ge 200 ] && [ "$http_code" -lt 300 ]; then
            echo "ERROR: admin_get_response_detail accepted anonymous access"
            exit 1
          fi

          python - <<'PY'
          from pathlib import Path
          raw = Path('/tmp/admin-private-rpc.json').read_text(errors='replace')
          forbidden = ('contact_info', 'contact_email_or_phone', 'responder_contact')
          lowered = raw.lower()
          if any(key in lowered for key in forbidden):
              raise SystemExit('Private contact data appeared in anonymous RPC response')
          print('Anonymous Admin RPC denial check passed')
          PY
      - name: Verify notification RPC rejects anonymous access
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SUPABASE_URL"
          test -n "$SUPABASE_KEY"

          http_code=$(curl -sS \
            -o /tmp/admin-notifications-rpc.json \
            -w "%{http_code}" \
            -X POST "$SUPABASE_URL/rest/v1/rpc/admin_list_notifications" \
            -H "apikey: $SUPABASE_KEY" \
            -H "Authorization: Bearer $SUPABASE_KEY" \
            -H "Content-Type: application/json" \
            -d '{"p_limit":1,"p_before_created_at":null,"p_before_id":null,"p_unread_only":false,"p_category":null}')

          if [ "$http_code" -ge 200 ] && [ "$http_code" -lt 300 ]; then
            echo "ERROR: admin_list_notifications accepted anonymous access"
            cat /tmp/admin-notifications-rpc.json
            exit 1
          fi

          echo "Anonymous notification RPC denial check passed"


      - name: Verify duplicate-protection RPCs reject anonymous access
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SUPABASE_URL"
          test -n "$SUPABASE_KEY"

          check_denied() {
            rpc_name="$1"
            payload="$2"
            output="/tmp/${rpc_name}.json"

            http_code=$(curl -sS               -o "$output"               -w "%{http_code}"               -X POST "$SUPABASE_URL/rest/v1/rpc/$rpc_name"               -H "apikey: $SUPABASE_KEY"               -H "Authorization: Bearer $SUPABASE_KEY"               -H "Content-Type: application/json"               -d "$payload")

            if [ "$http_code" -ge 200 ] && [ "$http_code" -lt 300 ]; then
              echo "ERROR: $rpc_name accepted anonymous access"
              cat "$output"
              exit 1
            fi
          }

          check_denied "admin_check_source_duplicate"             '{"p_canonical_url":"https://example.invalid/anonymous-duplicate-smoke"}'
          check_denied "admin_check_report_duplicate"             '{"p_complaint_id":"__anonymous_duplicate_smoke__"}'
          check_denied "admin_confirm_reports_are_distinct"             '{"p_complaint_id":"__anonymous_duplicate_smoke_a__","p_candidate_complaint_id":"__anonymous_duplicate_smoke_b__","p_review_note":"anonymous access must be denied"}'

          echo "Anonymous duplicate-protection RPC denial checks passed"

      - name: Verify News Intake RPCs reject anonymous access
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SUPABASE_URL"
          test -n "$SUPABASE_KEY"

          check_denied() {
            rpc_name="$1"
            payload="$2"
            output="/tmp/${rpc_name}.json"

            http_code=$(curl -sS               -o "$output"               -w "%{http_code}"               -X POST "$SUPABASE_URL/rest/v1/rpc/$rpc_name"               -H "apikey: $SUPABASE_KEY"               -H "Authorization: Bearer $SUPABASE_KEY"               -H "Content-Type: application/json"               -d "$payload")

            if [ "$http_code" -ge 200 ] && [ "$http_code" -lt 300 ]; then
              echo "ERROR: $rpc_name accepted anonymous access"
              cat "$output"
              exit 1
            fi
          }

          check_denied "admin_check_news_source_domain"             '{"p_url":"https://www.thedailystar.net/__anonymous_news_intake_smoke__"}'
          check_denied "admin_preview_sourced_report_intake"             '{"p_payload":{"source":{"canonicalUrl":"https://www.thedailystar.net/__anonymous_news_intake_smoke__"},"report":{}}}'
          check_denied "admin_create_sourced_report_from_intake"             '{"p_payload":{"source":{"canonicalUrl":"https://www.thedailystar.net/__anonymous_news_intake_smoke__"},"report":{}}}'
          check_denied "admin_merge_intake_source"             '{"p_complaint_id":"__anonymous_news_intake_smoke__","p_source":{"canonicalUrl":"https://www.thedailystar.net/__anonymous_news_intake_smoke__"}}'
          check_denied "admin_get_news_intake_taxonomy" '{}'
          check_denied "admin_get_location_taxonomy" '{}'
          check_denied "admin_resolve_news_intake_location" '{"p_text":"Dhaka","p_language":"en"}'
          check_denied "admin_get_news_intake_scan_sources" '{}'
          check_denied "admin_begin_news_intake_run" '{}'
          check_denied "admin_get_news_intake_automation_dashboard" '{}'
          check_denied "admin_set_news_intake_auto_update" '{"p_enabled":false}'
          check_denied "service_begin_news_intake_run" '{}'
          check_denied "service_begin_scheduled_news_intake_run" '{"p_scheduled_slot":"2026-09-19T00:00:00Z"}'
          check_denied "admin_record_news_intake_item" '{"p_run_id":"00000000-0000-0000-0000-000000000000","p_item":{}}'
          check_denied "admin_finish_news_intake_run" '{"p_run_id":"00000000-0000-0000-0000-000000000000","p_status":"failed","p_error":"anonymous smoke"}'

          echo "Anonymous News Intake RPC denial checks passed"

      - name: Verify News Intake fetcher rejects anonymous access
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SUPABASE_URL"
          test -n "$SUPABASE_KEY"

          http_code=$(curl -sS             -o /tmp/news-intake-fetch-anon.json             -w "%{http_code}"             -X POST "$SUPABASE_URL/functions/v1/news-intake-fetch"             -H "apikey: $SUPABASE_KEY"             -H "Content-Type: application/json"             -d '{"url":"https://www.thedailystar.net/__anonymous_news_intake_smoke__"}')

          if [ "$http_code" -ge 200 ] && [ "$http_code" -lt 300 ]; then
            echo "ERROR: news-intake-fetch accepted anonymous access"
            cat /tmp/news-intake-fetch-anon.json
            exit 1
          fi

          echo "Anonymous News Intake Edge Function denial check passed"


      - name: Verify News Intake scanner rejects anonymous access
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SUPABASE_URL"
          test -n "$SUPABASE_KEY"

          http_code=$(curl -sS             -o /tmp/news-intake-scan-anon.json             -w "%{http_code}"             -X POST "$SUPABASE_URL/functions/v1/news-intake-scan"             -H "apikey: $SUPABASE_KEY"             -H "Content-Type: application/json"             -d '{}')

          if [ "$http_code" -ge 200 ] && [ "$http_code" -lt 300 ]; then
            echo "ERROR: news-intake-scan accepted anonymous access"
            cat /tmp/news-intake-scan-anon.json
            exit 1
          fi

          echo "Anonymous News Intake scanner denial check passed"
