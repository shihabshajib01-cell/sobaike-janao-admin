name: Production Smoke

on:
  workflow_run:
    workflows: ["Deploy to GitHub Pages"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SITE_URL: https://shihabshajib01-cell.github.io/sobaike-janao-admin/
      SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
      SUPABASE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}

    steps:
      - name: Verify live Admin site
        shell: bash
        run: |
          set -euo pipefail
          ok=0
          for attempt in {1..12}; do
            code=$(curl -L -sS -o /tmp/admin-index.html -w "%{http_code}" "$SITE_URL" || true)
            if [ "$code" = "200" ]; then
              if python - <<'PY'
          from pathlib import Path
          html = Path('/tmp/admin-index.html').read_text(errors='replace')
          valid_root = 'id="root"' in html or "id='root'" in html
          source_free = '/src/main.tsx' not in html and '/src/entry.js' not in html and 'src/main.tsx' not in html and 'src/entry.js' not in html
          has_bundle = 'assets/' in html and '.js' in html
          raise SystemExit(0 if valid_root and source_free and has_bundle else 1)
          PY
              then
                ok=1
                break
              fi
              echo "Attempt $attempt reached the site but the new production bundle is not visible yet; retrying..."
            else
              echo "Attempt $attempt returned HTTP $code; retrying..."
            fi
            sleep 10
          done
          test "$ok" = "1"

          asset_path=$(grep -o 'assets/index-[^" ]*\.js' /tmp/admin-index.html | head -1)
          test -n "$asset_path"
          asset_code=$(curl -L -sS -o /tmp/admin-main.js -w "%{http_code}" "$SITE_URL$asset_path" || true)
          test "$asset_code" = "200"

          if grep -Eq 'src/(main\.tsx|entry\.js)' /tmp/admin-index.html; then
            echo "ERROR: live Admin index references source entry files"
            exit 1
          fi

          echo "Admin site smoke check passed with live bundle asset"

      - name: Verify private Admin RPC rejects anonymous access
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SUPABASE_URL"
          test -n "$SUPABASE_KEY"

          http_code=$(curl -sS \
            -o /tmp/admin-private-rpc.json \
            -w "%{http_code}" \
            -X POST "$SUPABASE_URL/rest/v1/rpc/admin_get_response_detail" \
            -H "apikey: $SUPABASE_KEY" \
            -H "Authorization: Bearer $SUPABASE_KEY" \
            -H "Content-Type: application/json" \
            -d '{"p_response_id":"__production_smoke_unauthorized__"}')

          if [ "$http_code" -ge 200 ] && [ "$http_code" -lt 300 ]; then
            echo "ERROR: admin_get_response_detail accepted anonymous access"
            exit 1
          fi

          python - <<'PY'
          from pathlib import Path
          raw = Path('/tmp/admin-private-rpc.json').read_text(errors='replace')
          forbidden = ('contact_info', 'contact_email_or_phone', 'responder_contact')
          lowered = raw.lower()
          if any(key in lowered for key in forbidden):
              raise SystemExit('Private contact data appeared in anonymous RPC response')
          print('Anonymous Admin RPC denial check passed')
          PY
      - name: Verify notification RPC rejects anonymous access
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SUPABASE_URL"
          test -n "$SUPABASE_KEY"

          http_code=$(curl -sS \
            -o /tmp/admin-notifications-rpc.json \
            -w "%{http_code}" \
            -X POST "$SUPABASE_URL/rest/v1/rpc/admin_list_notifications" \
            -H "apikey: $SUPABASE_KEY" \
            -H "Authorization: Bearer $SUPABASE_KEY" \
            -H "Content-Type: application/json" \
            -d '{"p_limit":1,"p_before_created_at":null,"p_before_id":null,"p_unread_only":false,"p_category":null}')

          if [ "$http_code" -ge 200 ] && [ "$http_code" -lt 300 ]; then
            echo "ERROR: admin_list_notifications accepted anonymous access"
            cat /tmp/admin-notifications-rpc.json
            exit 1
          fi

          echo "Anonymous notification RPC denial check passed"

