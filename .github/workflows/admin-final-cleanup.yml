name: Admin Final Cleanup

on:
  push:
    branches:
      - cleanup/mock-dead-code

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cleanup/mock-dead-code
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Remove remaining verified mock and dead code
        shell: bash
        run: |
          cat > /tmp/final-cleanup.cjs <<'NODE'
          const fs = require('fs');
          const ts = require(process.cwd() + '/node_modules/typescript');

          function read(path) { return fs.readFileSync(path, 'utf8'); }
          function write(path, text) { fs.writeFileSync(path, text); }
          function mustReplace(text, from, to, label) {
            if (!text.includes(from)) throw new Error(`Expected text not found: ${label}`);
            return text.replace(from, to);
          }

          // 1) Notification API: remove synthetic notification data and fail closed when unconfigured.
          {
            const path = 'src/services/api/notificationApi.ts';
            let text = read(path);
            const start = text.indexOf('// Dev fallback in-memory data adhering strictly to canonical database schema');
            const end = text.indexOf('export const notificationApi = {');
            if (start < 0 || end < 0 || end <= start) throw new Error('Notification fallback block markers not found');
            text = text.slice(0, start) + text.slice(end);

            const sf = ts.createSourceFile(path, text, ts.ScriptTarget.Latest, true, ts.ScriptKind.TS);
            const decl = sf.statements.find((s) =>
              ts.isVariableStatement(s) &&
              s.declarationList.declarations.some((d) => ts.isIdentifier(d.name) && d.name.text === 'notificationApi')
            );
            if (!decl) throw new Error('notificationApi declaration not found');
            const varDecl = decl.declarationList.declarations.find((d) => ts.isIdentifier(d.name) && d.name.text === 'notificationApi');
            if (!varDecl || !varDecl.initializer || !ts.isObjectLiteralExpression(varDecl.initializer)) throw new Error('notificationApi object not found');

            const edits = [];
            for (const prop of varDecl.initializer.properties) {
              if (!ts.isMethodDeclaration(prop) || !prop.body) continue;
              for (const stmt of prop.body.statements) {
                if (ts.isIfStatement(stmt) && stmt.expression.getText(sf).replace(/\s+/g, '') === '!isSupabaseConfigured') {
                  const replacement = `if (!isSupabaseConfigured) {\n      throw new NotificationApiError(\n        'Supabase notifications service is not configured in this environment.',\n        'CONFIG_ERROR'\n      );\n    }`;
                  edits.push({ start: stmt.getStart(sf), end: stmt.end, replacement });
                }
              }
            }
            if (edits.length !== 4) throw new Error(`Expected 4 notification config guards, found ${edits.length}`);
            edits.sort((a, b) => b.start - a.start);
            for (const e of edits) text = text.slice(0, e.start) + e.replacement + text.slice(e.end);
            write(path, text);
          }

          // 2) Move WorkflowActionResult out of the historical fallback directory.
          {
            const typePath = 'src/types/Complaint.ts';
            let text = read(typePath);
            if (!text.includes('export interface WorkflowActionResult')) {
              text += `\n\nexport interface WorkflowActionResult {\n  success: boolean;\n  complaint: Complaint;\n  timeline: ComplaintTimelineEvent[];\n  timelineError?: string | null;\n  messageEn: string;\n  messageBn: string;\n}\n`;
              write(typePath, text);
            }

            const apiPath = 'src/services/api/complaintApi.ts';
            let api = read(apiPath);
            api = mustReplace(api, '  ReporterDeviceLocation,\n} from \'@/types/Complaint\';', '  ReporterDeviceLocation,\n  WorkflowActionResult,\n} from \'@/types/Complaint\';', 'complaintApi type import');
            api = api.replace("import type { WorkflowActionResult } from '@/services/fallback/complaintFallback';\n", '');
            api = api.replace("export { type WorkflowActionResult } from '@/services/fallback/complaintFallback';\n", "export { type WorkflowActionResult } from '@/types/Complaint';\n");
            write(apiPath, api);

            const supaPath = 'src/services/api/supabaseComplaintService.ts';
            let supa = read(supaPath);
            supa = mustReplace(supa, '  HarassmentReportingFor,\n} from \'@/types/Complaint\';', '  HarassmentReportingFor,\n  WorkflowActionResult,\n} from \'@/types/Complaint\';', 'supabase complaint type import');
            supa = supa.replace("import { WorkflowActionResult } from '@/services/fallback/complaintFallback';\n", '');
            write(supaPath, supa);
          }

          // 3) Dashboard no longer has a mock fallback. Make the real contract explicit and remove dead helpers.
          {
            const path = 'src/services/api/dashboardApi.ts';
            let text = read(path);
            text = text.replace(/\n  \/\*\*\n   \* Ensures configuration check passes or allows fallback data\.\n   \*\/\n  private checkConfiguration\(\): void \{\n    \/\/ No-op: complaintApi handles transparent fallback to mock fixtures when needed\n  \}\n/, '\n');
            text = mustReplace(
              text,
              '  private async fetchAggregates(): Promise<{\n    stats: DashboardStats;\n    categorySummary: CategorySummaryItem[];\n  }> {\n    if (this.aggregatesPromise) {',
              "  private async fetchAggregates(): Promise<{\n    stats: DashboardStats;\n    categorySummary: CategorySummaryItem[];\n  }> {\n    if (!isSupabaseConfigured) {\n      throw new Error('Supabase dashboard service is not configured in this environment.');\n    }\n\n    if (this.aggregatesPromise) {",
              'dashboard config guard'
            );
            text = text.replace('        if (isSupabaseConfigured) {', '        {');
            text = text.replace(/\n\s*\/\/ Fallback for unconfigured dev environment\n\s*const stats = await this\.getFallbackStats\(\);\n\s*const categorySummary = await this\.getFallbackCategories\(stats\.totalComplaints\);\n\s*return \{ stats, categorySummary \};/, '');
            text = text.replace(/\n  \/\*\*\n   \* Fallback stats generator when Supabase is not configured \(e\.g\. dev mock\)\.\n   \*\/\n  private async getFallbackStats\(\): Promise<DashboardStats> \{.*?\n  \}\n\n  \/\*\*\n   \* Fallback category generator when Supabase is not configured \(e\.g\. dev mock\)\.\n   \*\/\n  private async getFallbackCategories\(totalComplaints: number\): Promise<CategorySummaryItem\[]> \{.*?\n  \}\n/s, '\n');
            text = text.replace(/\n\s*this\.checkConfiguration\(\);\n/, '\n');
            write(path, text);
          }

          // 4) Remove stale comments that still describe deleted dev-mock behavior.
          {
            const rolePath = 'src/services/api/roleApi.ts';
            let role = read(rolePath);
            role = role.replace(" * - When Supabase credentials are unconfigured AND in local dev (`import.meta.env.DEV`): allows dev fixtures.\n", '');
            role = role.replace(' * - When Supabase credentials are unconfigured in production: immediately throws a distinguishable RoleApiError with code \'CONFIG_ERROR\'.\n', " * - When Supabase credentials are unconfigured: immediately throws RoleApiError with code 'CONFIG_ERROR'.\n");
            write(rolePath, role);

            const authPath = 'src/services/auth/authService.ts';
            let auth = read(authPath);
            auth = auth.replace(' * - Dev mock exception strictly isolated to (!isSupabaseConfigured && import.meta.env.DEV).\n', ' * - Unconfigured environments fail closed.\n');
            write(authPath, auth);
          }
          NODE
          node /tmp/final-cleanup.cjs

          rm -f src/services/fallback/complaintFallback.ts
          rm -f src/assets/brand/index.ts
          rm -f src/components/layout/index.ts
          rm -f src/hooks/index.ts
          rm -f src/hooks/useLocalStorage.ts
          rm -f src/pages/Login/index.ts
          rm -f src/pages/Map/index.ts
          rm -f src/pages/Responses/index.ts
          rm -f src/services/auth/index.ts
          rm -f src/types/index.ts

          npm uninstall motion autoprefixer esbuild

      - name: Verify removed runtime fallbacks
        shell: bash
        run: |
          set -euo pipefail
          test ! -d src/services/mock || test -z "$(find src/services/mock -type f -print -quit 2>/dev/null)"
          test ! -e src/services/fallback/complaintFallback.ts
          if git grep -n -E 'FALLBACK_NOTIFICATIONS|inMemoryFallbackNotifications|DEV_MOCK|DEV_FALLBACK|dev_fallback|services/mock|services/fallback|complaintFallback' -- 'src/**'; then
            echo 'A removed mock/fallback runtime reference remains.' >&2
            exit 1
          fi

      - name: Typecheck build and dependency audit
        run: |
          npm run lint
          npm run build
          npm audit || true

      - name: Commit final cleanup
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo 'No final cleanup changes needed.'
            exit 0
          fi
          git config user.name 'shihabshajib01-cell'
          git config user.email 'shihabshajib01@gmail.com'
          git add -A
          git commit -m 'cleanup(admin): remove remaining mock and dead code'
          git push origin HEAD:cleanup/mock-dead-code
