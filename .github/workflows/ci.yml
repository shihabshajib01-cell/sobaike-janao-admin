name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Lockfile repair snapshot
        run: |
          npm install --package-lock-only --ignore-scripts
          echo "LOCKFILE_B64_BEGIN"
          base64 -w 0 package-lock.json
          echo
          echo "LOCKFILE_B64_END"

      - name: Install
        run: npm ci

      - name: Notification center audit
        run: npm run audit:notifications

      - name: Responsive table audit
        run: npm run audit:responsive-tables

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
