name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Normalize npm lock metadata
        run: npm install --package-lock-only --ignore-scripts

      - name: Install
        run: npm ci

      - name: Notification center audit
        run: npm run audit:notifications

      - name: Responsive table audit
        run: npm run audit:responsive-tables

      - name: Typography system audit
        run: npm run audit:typography

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
