name: Apply Admin bribery contract patch

on:
  push:
    branches:
      - fix/bribery-contract-alignment
    paths:
      - scripts/apply_bribery_admin_contract.py
      - .github/workflows/apply-bribery-admin-contract.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: fix/bribery-contract-alignment
          fetch-depth: 0

      - name: Apply exact guarded replacements
        run: python scripts/apply_bribery_admin_contract.py

      - name: Commit production source changes
        run: |
          if git diff --quiet; then
            echo "No source changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src
          git commit -m "feat(admin): display structured bribery details"
          git push origin HEAD:fix/bribery-contract-alignment
