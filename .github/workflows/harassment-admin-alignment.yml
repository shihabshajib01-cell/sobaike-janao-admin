name: Harassment Admin Verification

on:
  push:
    branches: [harassment-classification-impl]

permissions:
  contents: write

jobs:
  verify-and-fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: harassment-classification-impl
          fetch-depth: 0

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Reset hidden Harassment map filters when segment chip is removed
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');
          const path = 'src/components/map/MapFilters.tsx';
          let s = fs.readFileSync(path, 'utf8');
          const pattern = /onChange\(\{\s*\.\.\.filters,\s*segment:\s*'all',\s*subcategory:\s*'all',\s*\}\)/m;
          const matches = s.match(new RegExp(pattern.source, 'gm')) || [];
          if (matches.length !== 1) throw new Error(`Expected exactly one segment-chip reset block; found ${matches.length}`);
          s = s.replace(pattern, `onChange({
                        ...filters,
                        segment: 'all',
                        subcategory: 'all',
                        affectedPersonAgeGroup: 'all',
                        allegedAbuserRelationship: 'all',
                        reportingFor: 'all',
                      })`);
          fs.writeFileSync(path, s);
          NODE

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run lint

      - name: Production build
        run: npm run build

      - name: Diff check
        run: git diff --check

      - name: Commit verified fix
        shell: bash
        run: |
          git add src/components/map/MapFilters.tsx
          if git diff --cached --quiet; then
            echo "No change to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix(harassment): clear hidden map classification filters"
          git push origin HEAD:harassment-classification-impl
